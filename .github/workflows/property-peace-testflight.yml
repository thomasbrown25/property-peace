name: Property Peace iOS to TestFlight

on:
  push:
    branches:
      - dev
  workflow_dispatch:

jobs:
  build-and-submit:
    if: github.ref == 'refs/heads/dev'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: property-peace-mobile

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: property-peace-mobile/package-lock.json

      - name: Set up EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install mobile dependencies
        run: npm ci --no-audit --no-fund

      - name: Build iOS and submit to App Store Connect
        run: eas build --platform ios --profile production --auto-submit --non-interactive

name: property-peace-app-deploy-dev

on:
  push:
    branches: [dev]
    paths:
      - "property-peace-app/**"
      - "shared/**"
      - ".github/workflows/property-peace-app-deploy-dev.yml"
  workflow_dispatch:

jobs:
  build_and_deploy:
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    name: Build and Deploy Web App Dev
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: true
          lfs: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Build and Deploy to Azure Static Web Apps dev
        id: builddeploy
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_PROPERTY_PEACE_APP_DEV }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: upload
          app_location: "property-peace-app"
          api_location: ""
          skip_api_build: true
          output_location: "dist"
          app_build_command: |
            npm ci --no-audit --no-fund --loglevel=error
            npm install @rollup/rollup-linux-x64-gnu --no-save --no-audit --no-fund 2>/dev/null || true
            npm run build
        env:
          NODE_VERSION: "20"
          NODE_OPTIONS: "--max-old-space-size=4096"
          VITE_APP_API_URL: ${{ secrets.VITE_APP_API_URL_DEV }}
          VITE_GOOGLE_CLIENT_ID: ${{ secrets.VITE_GOOGLE_CLIENT_ID_DEV }}
          VITE_APP_GOOGLE_MAPS_API_KEY: ${{ secrets.VITE_APP_GOOGLE_MAPS_API_KEY }}
